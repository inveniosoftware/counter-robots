[project]
name = "counter-robots"
description = "Library for COUNTER-compliant detection of machines and robots."
readme = "README.rst"
license = "MIT"
authors = [
  { name = "CERN", email = "info@inveniosoftware.org" },
]
keywords = [
  "COUNTER",
  "detection",
  "robot",
  "user-agent",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/inveniosoftware/counter-robots"

[project.optional-dependencies]
docs = [
  "sphinx>=4.5.0",
]
tests = [
  "pytest-black>=0.6.0",
  "pytest-invenio>=3.0.0,<4.0.0",
  "sphinx>=4.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "counter_robots/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
  "/counter_robots",
]

[tool.isort]
profile = "black"

[tool.pydocstyle]
add_ignore = "D401"

[tool.pytest.ini_options]
addopts = '--black --isort --pydocstyle --doctest-glob="*.rst" --doctest-modules --cov=counter_robots --cov-report=term-missing'
testpaths = "tests counter_robots"
live_server_scope = "module"
